name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &build_paths
      - 'main.js'
      - 'preload.js'
      - 'downloader.js'
      - 'src/**'
      - 'ui/**'
      - 'assets/**'
      - 'sources/**'
      - 'tools/**'
      - 'test/check-integration.js'
      - 'test/check-download-retry.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          $bad = 0
          git ls-files '*.js' | ForEach-Object {
            node --check $_
            if ($LASTEXITCODE -ne 0) { Write-Host "::error file=$($_)::syntax error"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) failed syntax check" }

      - name: Check IPC, assets, and packaging configuration
        run: node test/check-integration.js

      - name: Check download retry and cancellation
        run: node test/check-download-retry.js

      - name: Build NSIS installer
        run: npm run dist

      - name: Verify artifact
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item -LiteralPath "out-electron/WindTune-Setup-$version.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$($exe.Name)  $([math]::Round($exe.Length / 1MB, 1)) MB"
          "sha256 $hash"
          Add-Content $env:GITHUB_STEP_SUMMARY "- $($exe.Name) - $([math]::Round($exe.Length / 1MB, 1)) MB - sha256 $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: WindTune-Setup
          path: out-electron/*.exe
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WindTune-Setup
          path: out-electron

      - uses: softprops/action-gh-release@v3
        with:
          files: out-electron/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
